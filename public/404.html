<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MenuFly - Redirecionando...</title>
    <script>
      // SPA redirect - handles direct navigation to routes
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + (path !== '/' ? '?redirect=' + encodeURIComponent(path) : ''));
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0;url=/" />
    </noscript>
  </body>
</html>
